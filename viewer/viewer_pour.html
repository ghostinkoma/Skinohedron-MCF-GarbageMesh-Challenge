<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KSF — 注水の渦 (GLSL / Navier–Stokes)</title>
<style>
  :root{--bg:#0a0e13;--panel:#121821;--ink:#e7eef6;--mut:#8aa0b4;--line:#24303d;--teal:#2dd4bf;--amber:#f59e0b;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif}
  header{padding:14px 18px 8px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 2px;font-size:17px}
  .sub{color:var(--mut);font-size:12px}
  #wrap{display:flex;height:calc(100vh - 58px)}
  #side{width:280px;min-width:280px;background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow-y:auto}
  #stage{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:8px 0}
  .seg button{flex:1;padding:9px 0;background:transparent;border:none;color:var(--mut);font:inherit;font-size:12.5px;cursor:pointer}
  .seg button.on{background:#1b2430;color:var(--ink)}
  label{display:block;font-size:11.5px;color:var(--mut);margin:12px 0 3px}
  input[type=range]{width:100%;accent-color:var(--amber)}
  .val{color:var(--teal);font-weight:600}
  .eq{background:#0e141c;border:1px solid var(--line);border-radius:8px;padding:10px;margin:12px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.7;color:#cfe}
  .eq b{color:var(--amber)}
  .note{font-size:11.5px;color:var(--mut);margin-top:10px}
  .tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700;background:rgba(45,212,191,.14);color:var(--teal);margin-left:6px}
  @media (max-width:760px){
    #wrap{flex-direction:column;height:auto;min-height:100vh}
    #side{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--line)}
    #stage{height:60vh;min-height:340px}
  }
</style>
</head>
<body>
<header>
  <h1>注水の渦 — 円柱コップ vs 角柱の升 <span class="tag">GLSL / NS</span></h1>
  <div class="sub">注ぎ込みによる二次渦。丸いコップは滑らか、角ある升にはコーナー渦（Moffatt）。検証済の物理（10）に基づく定性可視化。</div>
</header>
<div id="wrap">
  <div id="side">
    <div class="seg" id="shape">
      <button data-s="0" class="on">円柱コップ</button>
      <button data-s="1">角柱の升</button>
    </div>
    <label>レイノルズ数 Re = <span class="val" id="reLab">800</span></label>
    <input type="range" id="re" min="50" max="2500" value="800" step="50"/>
    <label>注水の勢い (中央流入) = <span class="val" id="inLab">0.6</span></label>
    <input type="range" id="inflow" min="0" max="1" value="0.6" step="0.05"/>
    <label>表示: <span class="val" id="modeLab">渦度</span></label>
    <div class="seg" id="mode">
      <button data-m="0" class="on">渦度</button>
      <button data-m="1">流線</button>
      <button data-m="2">速さ</button>
    </div>

    <div class="eq" id="eq">
      <b>定常非圧縮 NS</b><br>
      (u·∇)u = −∇p/ρ + ν∇²u<br>
      ∇·u = 0,  ν = U L / Re<br><br>
      <b>渦度</b> ω = ∂v/∂x − ∂u/∂y<br>
      <b>主渦</b>: 中央の大きな循環<br>
      <b>コーナー渦</b>(Moffatt): 角で ψ ∝ r·e^{−λθ}<br>
      — 逆回りの小渦が入れ子状に
    </div>
    <div class="note" id="note"></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
</div>

<script>
const cv=document.getElementById('cv'); const gl=cv.getContext('webgl');
let state={shape:0,Re:800,inflow:0.6,mode:0,t:0};

const VERT=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
// 検証済み物理に基づく定性可視化:
//  主渦(中央循環) + Moffatt型コーナー渦(角柱のみ角に逆回りの減衰渦)
//  Reで二次渦が強まる(10章の検証: 移流で成長)。丸コップは角が無く滑らか。
const FRAG=`
precision highp float;
uniform vec2 res; uniform float Re, inflow, t; uniform int shape, mode;
#define PI 3.14159265

// 主渦の流れ関数(中央循環)。容器内 [-1,1]^2 想定、円 or 角でマスク。
float psiMain(vec2 q){
  float r=length(q);
  // 中央で強い循環、壁でゼロ。注水でやや上方駆動
  return (1.0-r*r)*(0.6+0.4*inflow)*(1.0+0.15*q.y);
}
// Moffatt コーナー渦: 角(±1,±1)近傍で psi ~ d * cos(k*log d) の減衰振動(逆回り入れ子)
float cornerEddy(vec2 q){
  if(shape==0) return 0.0;        // 円柱コップは角が無い -> コーナー渦なし
  float s=0.0;
  vec2 corners[4];
  corners[0]=vec2(-1.,-1.); corners[1]=vec2(1.,-1.);
  corners[2]=vec2(-1.,1.);  corners[3]=vec2(1.,1.);
  for(int i=0;i<4;i++){
    vec2 c=corners[i]; vec2 d=q-c; float dd=length(d);
    if(dd<0.55){
      // 角からの距離で減衰振動(Moffatt自己相似渦列)。Reで強度↑(10章: 移流で成長)
      float ang=atan(abs(d.y),abs(d.x));
      float reb=clamp((Re-150.)/2000.,0.0,1.0);
      s+=reb*0.18*exp(-6.0*dd)*sin(7.0*log(dd+0.04))*sin(2.0*ang);
    }
  }
  return s;
}
float psi(vec2 q){ return psiMain(q)+cornerEddy(q); }

// 速度 = curl(psi): u=∂psi/∂y, v=-∂psi/∂x  (有限差分)
vec2 vel(vec2 q){
  float e=0.004;
  float dpx=(psi(q+vec2(e,0.))-psi(q-vec2(e,0.)))/(2.*e);
  float dpy=(psi(q+vec2(0.,e))-psi(q-vec2(0.,e)))/(2.*e);
  return vec2(dpy,-dpx);
}
float vort(vec2 q){
  float e=0.004;
  vec2 vx1=vel(q+vec2(e,0.)),vx0=vel(q-vec2(e,0.));
  vec2 vy1=vel(q+vec2(0.,e)),vy0=vel(q-vec2(0.,e));
  return (vx1.y-vx0.y)/(2.*e)-(vy1.x-vy0.x)/(2.*e);
}
bool inside(vec2 q){
  if(shape==0) return length(q)<1.0;     // 円
  return abs(q.x)<1.0 && abs(q.y)<1.0;    // 角(升)
}
vec3 ramp(float x){ // teal->dark->amber 双極
  x=clamp(x,-1.,1.);
  vec3 pos=mix(vec3(.05,.08,.11),vec3(.96,.62,.07),clamp(x,0.,1.));
  vec3 neg=mix(vec3(.05,.08,.11),vec3(.18,.83,.75),clamp(-x,0.,1.));
  return x>=0.?pos:neg;
}
void main(){
  vec2 uv=(gl_FragCoord.xy/res)*2.0-1.0; uv.x*=res.x/res.y;
  vec2 q=uv*1.18;
  if(!inside(q)){ gl_FragColor=vec4(0.03,0.05,0.07,1.); return; }
  vec3 col;
  if(mode==0){ col=ramp(vort(q)*1.6); }
  else if(mode==2){ float sp=length(vel(q)); col=mix(vec3(.05,.08,.11),vec3(.18,.83,.75),sp*1.3); }
  else {
    // 流線: psi の等値線
    float ps=psi(q); float band=abs(fract(ps*9.0+0.5)-0.5);
    float line=smoothstep(0.06,0.0,band);
    vec2 v=vel(q); float sp=length(v);
    col=mix(vec3(.06,.09,.12),vec3(.55,.78,.95),line)*(0.5+0.8*sp);
  }
  // 壁の縁取り
  float edge = shape==0 ? smoothstep(0.02,0.0,abs(length(q)-1.0))
                        : smoothstep(0.02,0.0,min(1.0-abs(q.x),1.0-abs(q.y)));
  col=mix(col,vec3(.55,.62,.72),edge*0.6);
  gl_FragColor=vec4(col,1.);
}`;

function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VERT));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const pl=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,2,gl.FLOAT,false,0,0);
const U={res:gl.getUniformLocation(prog,'res'),Re:gl.getUniformLocation(prog,'Re'),
  inflow:gl.getUniformLocation(prog,'inflow'),t:gl.getUniformLocation(prog,'t'),
  shape:gl.getUniformLocation(prog,'shape'),mode:gl.getUniformLocation(prog,'mode')};

function resize(){const r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;gl.viewport(0,0,cv.width,cv.height);}
window.addEventListener('resize',resize);

function notes(){
  const n=document.getElementById('note');
  n.innerHTML = state.shape===0
   ? "円柱コップ: 角が無いため Moffatt コーナー渦は生じず、中央主渦が滑らかに周る。"
   : "角柱の升: 四つの角に逆回りの Moffatt 渦が入れ子状に現れる。Re を上げると二次渦が強まる（10章の検証）。";
}
function render(){
  state.t+=0.016;
  gl.uniform2f(U.res,cv.width,cv.height);
  gl.uniform1f(U.Re,state.Re);gl.uniform1f(U.inflow,state.inflow);gl.uniform1f(U.t,state.t);
  gl.uniform1i(U.shape,state.shape);gl.uniform1i(U.mode,state.mode);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(render);
}
document.querySelectorAll('#shape button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#shape button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  state.shape=+b.dataset.s;notes();});
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#mode button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  state.mode=+b.dataset.m;document.getElementById('modeLab').textContent=['渦度','流線','速さ'][state.mode];});
document.getElementById('re').oninput=e=>{state.Re=+e.target.value;document.getElementById('reLab').textContent=state.Re;};
document.getElementById('inflow').oninput=e=>{state.inflow=+e.target.value;document.getElementById('inLab').textContent=(+e.target.value).toFixed(2);};
resize();notes();render();
</script>
</body>
</html>
