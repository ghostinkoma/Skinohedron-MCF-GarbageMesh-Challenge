<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KSF V3 — 数理モデルビューア (Model Map)</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --ink:#e7eef6; --mut:#8aa0b4;
    --line:#24303d; --teal:#2dd4bf; --amber:#f59e0b; --violet:#a78bfa; --blue:#60a5fa;
    --exact:#2dd4bf; --oh2:#f59e0b; --bad:#fb7185;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif}
  header{padding:18px 22px 8px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 3px;font-size:18px;letter-spacing:.02em}
  .sub{color:var(--mut);font-size:12.5px}
  .wrap{display:grid;grid-template-columns:1.15fr .85fr;gap:0;min-height:calc(100vh - 64px)}
  @media(max-width:880px){.wrap{grid-template-columns:1fr}}
  .left{padding:18px 20px;border-right:1px solid var(--line)}
  .right{padding:18px 20px;background:var(--panel2)}
  svg{width:100%;height:auto;display:block}
  .node{cursor:pointer;transition:opacity .15s}
  .node:hover{opacity:.85}
  .nlabel{font-size:13px;font-weight:600;fill:var(--ink)}
  .nrole{font-size:10.5px;fill:var(--mut)}
  .center text{fill:var(--ink)}
  .edge{stroke:var(--line);stroke-width:1.5}
  .badge{font-size:10px;font-weight:700}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .card h2{margin:0 0 8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
  .fact{font-size:13.5px;margin:6px 0}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-left:6px}
  .pill.exact{background:rgba(45,212,191,.15);color:var(--teal)}
  .pill.oh2{background:rgba(245,158,11,.15);color:var(--amber)}
  .pill.fuse{background:rgba(167,139,250,.15);color:var(--violet)}
  .pill.vel{background:rgba(96,165,250,.15);color:var(--blue)}
  .src{color:var(--mut);font-size:11.5px;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mut);font-weight:600}
  .bar{height:7px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--blue))}
  ul{margin:6px 0;padding-left:18px}
  li{margin:3px 0}
  .earned li{color:var(--ink)}
  .nearned li{color:#f3c6cd}
  .rulerow{display:flex;gap:8px;align-items:flex-start;margin:7px 0}
  .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tab{padding:5px 11px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:12px;color:var(--mut)}
  .tab.active{background:var(--panel);color:var(--ink);border-color:#33455a}
  .hint{color:var(--mut);font-size:11.5px;margin-top:4px}
  .eqrow{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:5px 0;font-size:12.5px}
  .eqrow .mono{color:var(--ink)} .eqrow .nm{color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>KSF V3 — 数理モデルビューア</h1>
  <div class="sub">一つの作用素 <span class="mono">L = M⁻¹K</span> と四つのドメイン。表示される数値はすべて検証スクリプトの出力（ブラウザ内計算なし）。</div>
</header>
<div class="wrap">
  <div class="left">
    <svg id="map" viewBox="0 0 560 520" aria-label="domain map"></svg>
    <div class="hint">ノードをクリックして詳細と検証数値を表示 · 色は精度（緑=機械精度 / 橙=O(h²)）</div>
    <div class="card" style="margin-top:14px">
      <h2>作用素の読み替え (operator readings)</h2>
      <div id="readings"></div>
    </div>
  </div>
  <div class="right">
    <div class="tabs">
      <div class="tab active" data-t="detail">ドメイン詳細</div>
      <div class="tab" data-t="rule">機械精度の規則</div>
      <div class="tab" data-t="enrich">高次化→機械精度</div>
      <div class="tab" data-t="scope">正直な範囲</div>
    </div>
    <div id="pane"></div>
  </div>
</div>
<script src="data_model.js"></script>
<script>
const $ = (s,el=document)=>el.querySelector(s);
const NS="http://www.w3.org/2000/svg";
function el(tag,attrs={},txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!=null)e.textContent=txt;return e;}

// ---- domain map ----
const map=$("#map");
const cx=280,cy=250,R=165;
const colorByPrec=p=> p==="exact"?"var(--exact)": p==="O(h²)"?"var(--oh2)": p&&p.indexOf("div-free")>=0?"var(--blue)":"var(--violet)";
const pillClass=d=> d.precision==="exact"?"exact": d.precision==="O(h²)"?"oh2": d.id==="velocity"?"vel":"fuse";

const angles = MODEL.domains.map((_,i)=> (-Math.PI/2) + i*(2*Math.PI/MODEL.domains.length));
MODEL.domains.forEach((d,i)=>{
  const ax=cx+R*Math.cos(angles[i]), ay=cy+R*Math.sin(angles[i]);
  map.appendChild(el("line",{class:"edge",x1:cx,y1:cy,x2:ax,y2:ay}));
});
// center
const cg=el("g",{class:"center"});
cg.appendChild(el("circle",{cx,cy,r:46,fill:"#0e141c",stroke:"#33455a","stroke-width":1.5}));
cg.appendChild(el("text",{x:cx,y:cy-2,"text-anchor":"middle","font-size":16,"font-weight":700,"font-family":"ui-monospace,monospace"},"L = M⁻¹K"));
cg.appendChild(el("text",{x:cx,y:cy+16,"text-anchor":"middle","font-size":10,fill:"var(--mut)"},"one operator"));
map.appendChild(cg);
// nodes
MODEL.domains.forEach((d,i)=>{
  const ax=cx+R*Math.cos(angles[i]), ay=cy+R*Math.sin(angles[i]);
  const g=el("g",{class:"node"}); g.style.cursor="pointer";
  const w=150,h=52;
  g.appendChild(el("rect",{x:ax-w/2,y:ay-h/2,rx:11,width:w,height:h,fill:"#121821",stroke:d.color,"stroke-width":1.6}));
  g.appendChild(el("circle",{cx:ax-w/2+14,cy:ay-h/2+14,r:5,fill:d.color}));
  g.appendChild(el("text",{class:"nlabel",x:ax-w/2+26,y:ay-h/2+18},d.label));
  g.appendChild(el("text",{class:"nrole",x:ax-w/2+14,y:ay-h/2+34},d.role.length>26?d.role.slice(0,25)+"…":d.role));
  g.appendChild(el("text",{class:"badge",x:ax-w/2+14,y:ay-h/2+47,fill:d.color},d.precision));
  g.addEventListener("click",()=>{showDetail(d); setTab("detail");});
  map.appendChild(g);
});

// ---- readings ----
const rd=$("#readings");
MODEL.readings.forEach(r=>{
  const row=document.createElement("div"); row.className="eqrow";
  row.innerHTML=`<span class="mono">${r.eq}</span><span class="nm">${r.name} &middot; ${r.doc}</span>`;
  rd.appendChild(row);
});

// ---- panes ----
const pane=$("#pane");
function showDetail(d){
  pane.innerHTML=`
    <div class="card">
      <h2>${d.label} <span class="pill ${pillClass(d)}">${d.precision}</span></h2>
      <div class="fact mono">${d.fact}</div>
      <div class="fact">${d.detail}</div>
      <div class="src">script: <span class="mono">${d.script}</span> &middot; doc: ${d.doc}</div>
    </div>
    <div class="card">
      <h2>このドメインの位置</h2>
      <div class="fact">質量=厳密 / クーロン=O(h²)（高次化で機械精度） / 温度=融合と媒介 / 速度=非圧縮機械精度・圧力分離。</div>
    </div>`;
}
function showRule(){
  let rows=MODEL.rule.map(r=>{
    const c=r.cls==="exact"?"var(--exact)":"var(--oh2)";
    return `<div class="rulerow"><div class="dot" style="background:${c}"></div>
      <div><b>${r.kind}</b><br><span class="hint">${r.ex} &middot; <span class="mono">${r.val}</span></span></div></div>`;
  }).join("");
  pane.innerHTML=`<div class="card"><h2>機械精度の規則 (audit-corrected)</h2>${rows}
    <div class="hint" style="margin-top:8px">重要：放物線（Poiseuille）はP1に入らないthat、定数ソースの節点超収束で機械精度。「P1に入るから」ではない。</div></div>`;
}
function showEnrich(){
  const max=Math.log10(MODEL.enrichment[0].err), min=Math.log10(MODEL.enrichment[MODEL.enrichment.length-1].err);
  let rows=MODEL.enrichment.map(e=>{
    const f=(Math.log10(e.err)-min)/(max-min); const w=Math.max(3,f*100);
    return `<tr><td class="mono">${e.order}</td><td class="mono">${e.err.toExponential(2)}</td>
      <td style="width:55%"><div class="bar" style="width:${w}%"></div></td></tr>`;
  }).join("");
  pane.innerHTML=`<div class="card"><h2>局所高次化で剤性誤差→機械精度 (1-D, 検証済)</h2>
    <table><tr><th>次数</th><th>固有値誤差</th><th>バー(log)</th></tr>${rows}</table>
    <div class="hint" style="margin-top:8px">「次元拡張→射影」の検証可能な形：sinはP1に入らないthat、十分豊かな局所空間（P8）で機械精度。Kを豊かに、Mはそのまま。</div>
    <div class="src">script: <span class="mono">fluid_highorder_accuracy_verify.py</span> &middot; doc: 06f</div></div>`;
}
function showScope(){
  pane.innerHTML=`
   <div class="card earned"><h2>検証済み (earned)</h2><ul>${MODEL.earned.map(x=>`<li>${x}</li>`).join("")}</ul></div>
   <div class="card nearned"><h2>主張しない (not earned · from 06z)</h2><ul>${MODEL.notEarned.map(x=>`<li>${x}</li>`).join("")}</ul></div>
   <div class="card"><h2>最先端との比較 (vs SOTA)</h2><ul>${MODEL.sota.map(x=>`<li>${x}</li>`).join("")}</ul>
     <div class="hint" style="margin-top:6px">ソルバとしては競合しない。価値は認識論的（検証規律と概念的統一）。</div></div>`;
}
const panes={detail:()=>showDetail(MODEL.domains[0]),rule:showRule,enrich:showEnrich,scope:showScope};
function setTab(t){
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.t===t));
  panes[t]();
}
document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>setTab(tab.dataset.t)));
// init
showDetail(MODEL.domains[0]);
</script>
</body>
</html>
