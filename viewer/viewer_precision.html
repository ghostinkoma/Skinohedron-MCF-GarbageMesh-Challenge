<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KSF — 精度は本当に上がるか (細分・高次化)</title>
<style>
  :root{--bg:#0a0e13;--panel:#121821;--ink:#e7eef6;--mut:#8aa0b4;--line:#24303d;--teal:#2dd4bf;--amber:#f59e0b;--blue:#60a5fa;--violet:#a78bfa;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans JP",sans-serif}
  header{padding:14px 18px 8px;border-bottom:1px solid var(--line)}
  h1{margin:0 0 2px;font-size:17px}.sub{color:var(--mut);font-size:12px}
  #wrap{display:flex;height:calc(100vh - 58px)}
  #side{width:250px;min-width:250px;background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow-y:auto}
  #stage{flex:1;padding:18px;overflow-y:auto;min-width:0}
  .seg{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .seg button{padding:10px 12px;background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--mut);font:inherit;font-size:12.5px;cursor:pointer;text-align:left}
  .seg button.on{background:#1b2430;color:var(--ink);border-color:#33455a}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:14px}
  .src{color:var(--mut);font-size:11px;margin-bottom:10px}
  svg{width:100%;height:auto;display:block}
  .ax{stroke:var(--line);stroke-width:1}
  .gl{stroke:#1a2330;stroke-width:1}
  .lab{fill:var(--mut);font-size:10px}
  .pt{fill:var(--amber)}
  .pl{stroke:var(--amber);stroke-width:2;fill:none}
  .pt2{fill:var(--blue)}.pl2{stroke:var(--blue);stroke-width:2;fill:none}
  .note{font-size:12px;color:var(--mut);margin-top:8px}
  ul{margin:8px 0;padding-left:18px;font-size:12.5px}li{margin:4px 0}
  .leg{display:flex;gap:14px;font-size:11.5px;margin-top:6px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
  @media (max-width:760px){
    #wrap{flex-direction:column;height:auto;min-height:100vh}
    #side{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--line)}
    #stage{height:auto}
  }
</style>
</head>
<body>
<header>
  <h1>精度は本当に上がるか — (1)細分 + (3)高次化</h1>
  <div class="sub">レブ調査（10）のまとめ。表示数値はすべて検証スクリプト出力（ブラウザ内計算なし）。</div>
</header>
<div id="wrap">
  <div id="side">
    <div class="seg" id="nav">
      <button data-v="enrich" class="on">高次化 P1→P8</button>
      <button data-v="refine">細分 O(h²)</button>
      <button data-v="cavity">実ベンチマーク</button>
      <button data-v="rev">レブの分離</button>
      <button data-v="summary">まとめ</button>
    </div>
  </div>
  <div id="stage"><div id="pane"></div></div>
</div>

<script src="data_precision.js"></script>
<script>
const pane=document.getElementById('pane');
const W=560,H=320,M={l:64,r:20,t:24,b:42};
function logChart(points, key, color, color2, points2){
  // log scale on error
  const all=points.map(p=>p[key]).concat(points2?points2.map(p=>p[key]):[]);
  const lo=Math.log10(Math.min(...all)), hi=Math.log10(Math.max(...all));
  const pad=(hi-lo)*0.08||1; const ymin=lo-pad, ymax=hi+pad;
  const xN=points.length;
  const X=i=>M.l+(W-M.l-M.r)*(i/(xN-1));
  const Y=v=>M.t+(H-M.t-M.b)*(1-(Math.log10(v)-ymin)/(ymax-ymin));
  let g=`<svg viewBox="0 0 ${W} ${H}">`;
  // gridlines (decades)
  for(let d=Math.ceil(ymin);d<=Math.floor(ymax);d++){
    const y=M.t+(H-M.t-M.b)*(1-(d-ymin)/(ymax-ymin));
    g+=`<line class="gl" x1="${M.l}" y1="${y}" x2="${W-M.r}" y2="${y}"/>`;
    g+=`<text class="lab" x="${M.l-8}" y="${y+3}" text-anchor="end">1e${d}</text>`;
  }
  g+=`<line class="ax" x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${H-M.b}"/>`;
  g+=`<line class="ax" x1="${M.l}" y1="${H-M.b}" x2="${W-M.r}" y2="${H-M.b}"/>`;
  function poly(pts,k,cls,dcls){
    let d='';pts.forEach((p,i)=>{d+=(i?'L':'M')+X(i)+' '+Y(p[k])+' ';});
    let s=`<path class="${cls}" d="${d}"/>`;
    pts.forEach((p,i)=>{s+=`<circle class="${dcls}" cx="${X(i)}" cy="${Y(p[k])}" r="4"/>`;});
    return s;
  }
  g+=poly(points,key,'pl','pt');
  if(points2) g+=poly(points2,key,'pl2','pt2');
  points.forEach((p,i)=>{g+=`<text class="lab" x="${X(i)}" y="${H-M.b+16}" text-anchor="middle">${p.x}</text>`;});
  g+=`</svg>`;
  return g;
}
const V={
  enrich(){const e=PRECISION.enrichment;return card(e.title,e.source,
     logChart(e.points,'err','amber'),
     `正弦モード（(3)場固有）の誤差が、局所次数を上げるだけで P1 2e-2 → P8 2e-13 とスペクトル収束。Kを豊かにするだけで機械精度。`);},
  refine(){const e=PRECISION.refinement;
    // linear-ish % chart via log
    return card(e.title,e.source,logChart(e.points,'err','amber'),
     `剤性誤差（(1)近似）はメッシュを細かくすると 5.0%→1.3% と O(h²) で減る。質量 M は全 n で 0%（厳密）。`);},
  cavity(){const e=PRECISION.cavity;return card(e.title,e.source,
     logChart(e.pspg,'err','amber','blue',e.th),
     `<span class="leg"><span><span class="dot" style="background:var(--amber)"></span>PSPG (P1細分)</span><span><span class="dot" style="background:var(--blue)"></span>Taylor-Hood (P2高次)</span></span><br>実ベンチマーク（Ghia Re=1000）でも、細分と高次化で誤差が減る。TH（高次＝高次化）は少ない節点で高精度。`);},
  rev(){const r=PRECISION.revSeparation;return card("レブの分離：数値(1) vs 物理(3)","10",
     logChart(r.numerical.points,'err','amber','blue',r.physical.points),
     `<span class="leg"><span><span class="dot" style="background:var(--amber)"></span>${r.numerical.label}</span><span><span class="dot" style="background:var(--blue)"></span>${r.physical.label}</span></span><br>
      数値のレブは細分で <b>減る</b>（(1)近似）。物理のレブ（コーナー渦）は一定値に <b>収束</b>（(3)場固有）。両者は別物。`);},
  summary(){let li=PRECISION.summary.map(s=>`<li>${s}</li>`).join("");
    return `<div class="card"><h2>まとめ — 精度は本当に上がる</h2>
      <div class="src">06d / 06f / 08b / 10</div><ul>${li}</ul>
      <div class="note">「高次化すれば本当に精度が上がるか」→ 上がる。ただし上がるのは近似誤差(1)と剤性。場固有(3)の構造自体は残る（それが正しい物理）。</div></div>`;}
};
function card(title,source,chart,note){
  return `<div class="card"><h2>${title}</h2><div class="src">${source}</div>${chart}<div class="note">${note}</div></div>`;
}
function show(v){pane.innerHTML=V[v]();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
show('enrich');
</script>
</body>
</html>
